name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: Type Checking
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: TypeScript type check
        run: pnpm run typecheck:ts

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: "backend/uv.lock"

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install Python dev dependencies
        working-directory: backend
        run: uv sync --frozen --extra dev

      - name: Pyright type check
        working-directory: backend
        run: uv run pyright

  test-frontend:
    name: Frontend Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: "Vitest (pure modules: solver, motion, conversion, error mapping)"
        run: pnpm run test:frontend

  test-python:
    name: Python Tests (${{ matrix.os }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos
            runner: macos-latest
          - os: windows
            runner: windows-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: "backend/uv.lock"

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --frozen --extra test --extra dev

      - name: Run tests
        run: uv run pytest -v --tb=short

  build-check:
    name: Frontend Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Build frontend
        run: pnpm run build:frontend

  # ---------------------------------------------------------------------------
  # Installers. These build the real distributables (unsigned, never published)
  # and verify their contents, so a broken packaging config is caught before a
  # release. They do not download model weights or the full Python dependency
  # set: Windows stages Python on first launch (python-deps-hash.txt is bundled),
  # Linux uses the runtime-only bundle (LTX_PYTHON_DEPS=skip) documented in
  # docs/INSTALLER.md. Publishing a GitHub Release stays a manual step.
  # ---------------------------------------------------------------------------
  installer-windows:
    name: Windows Installer (NSIS, unsigned)
    runs-on: windows-latest
    needs: [typecheck, build-check]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Wan2GP checkout (bundled under resources/)
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File scripts/ensure-wan2gp.ps1

      - name: Build frontend + Electron main
        run: pnpm run build:frontend

      - name: Package NSIS installer (unsigned, no publish)
        shell: pwsh
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: pnpm exec electron-builder --win --publish never

      - name: Verify installer artifact
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path release -Filter "*Setup*.exe" | Select-Object -First 1
          if (-not $installer) { Write-Error "No *Setup*.exe produced in release/"; exit 1 }
          $sizeMb = [math]::Round($installer.Length / 1MB, 1)
          Write-Host "Installer: $($installer.Name) ($sizeMb MB)"
          if ($installer.Length -lt 60MB) { Write-Error "Installer is suspiciously small ($sizeMb MB)"; exit 1 }
          # The unpacked tree must carry the backend, the Wan2GP checkout and the deps hash.
          $unpacked = "release/win-unpacked/resources"
          foreach ($required in @("backend/ltx2_server.py", "backend/pyproject.toml", "Wan2GP/wgp.py", "python-deps-hash.txt", "app.asar")) {
            if (-not (Test-Path (Join-Path $unpacked $required))) { Write-Error "Missing from package: $required"; exit 1 }
          }
          if (Test-Path "release/win-unpacked/resources/backend/tests") { Write-Error "Backend tests must not ship"; exit 1 }
          Get-FileHash $installer.FullName -Algorithm SHA256 | Format-List
          "$($installer.Name)`nSHA256: $((Get-FileHash $installer.FullName -Algorithm SHA256).Hash)`nSize: $sizeMb MB" | Out-File release/INSTALLER-VERIFICATION.txt

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: ltx-desktop-windows-installer
          path: |
            release/*Setup*.exe
            release/INSTALLER-VERIFICATION.txt
          retention-days: 14
          if-no-files-found: error

  installer-linux:
    name: Linux AppImage (runtime-only Python)
    runs-on: ubuntu-latest
    needs: [typecheck, build-check]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          version: "latest"

      - run: pnpm install --frozen-lockfile

      - name: Wan2GP checkout (bundled under resources/)
        run: bash scripts/ensure-wan2gp.sh

      - name: Runtime-only Python bundle (packaging smoke — not shippable)
        run: LTX_PYTHON_DEPS=skip bash scripts/prepare-python.sh

      - name: Build frontend + Electron main
        run: pnpm run build:frontend

      - name: Package AppImage (unsigned, no publish)
        run: pnpm exec electron-builder --linux AppImage --publish never

      - name: Verify AppImage contents
        run: |
          set -euo pipefail
          appimage=$(ls release/*.AppImage | head -n1)
          test -n "$appimage" || { echo "No AppImage produced"; exit 1; }
          ls -la "$appimage"
          chmod +x "$appimage"
          "$appimage" --appimage-extract >/dev/null
          for required in squashfs-root/resources/backend/ltx2_server.py squashfs-root/resources/Wan2GP/wgp.py squashfs-root/resources/python squashfs-root/resources/app.asar; do
            test -e "$required" || { echo "Missing from AppImage: $required"; exit 1; }
          done
          test ! -e squashfs-root/resources/backend/tests || { echo "Backend tests must not ship"; exit 1; }
          sha256sum "$appimage" | tee release/APPIMAGE-VERIFICATION.txt

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: ltx-desktop-linux-appimage
          path: |
            release/*.AppImage
            release/APPIMAGE-VERIFICATION.txt
          retention-days: 14
          if-no-files-found: error
