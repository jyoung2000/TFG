# Local/derivative build identity — "LTX Desktop WanGP" (TFG fork).
#
# Distinct from the upstream Lightricks app so both can be installed
# side by side: different appId (Windows sees a different app), different
# productName (install dir, shortcuts, taskbar label), different icons
# (icon-wangp.*). Build with:
#   VITE_APP_BRAND=wangp node scripts/build-win-retry.mjs --win --config electron-builder-wangp.yml

extends: electron-builder.yml
appId: com.tfg.ltx-desktop-wangp
productName: LTX Desktop WanGP
copyright: Copyright © 2026 TFG

# Stage into its OWN directory. The base config sets `directories.output:
# release`, and `extends` inherits it, so without this override both flavors
# write into `release/` — where a generic `pnpm build:win` leaves a normal-app
# installer next to ours and `create-installer.ps1` reports whichever matches
# its `*Setup*` glob first. Separate dirs make "which app did I just build?"
# answerable by looking at the path.
directories:
  output: release-wangp

# CRITICAL: do not inherit upstream's update channel.
# `extends: electron-builder.yml` also inherits its `publish:` block
# (owner: Lightricks, repo: ltx-desktop), which electron-builder bakes into
# the packaged `resources/app-update.yml`. Left inherited, the fork ships
# pointing at the NORMAL app's GitHub releases: on first launch the installed
# WanGP build reported "Update downloaded: v1.2.7" from Lightricks and staged
# an upstream `LTX-Desktop-Setup.exe` in the updater cache, ready to replace
# this fork. It must point at the fork's own repo, which publishes no releases,
# so the updater finds nothing and the fork stays ours.
publish:
  provider: github
  owner: jyoung2000
  repo: TFG

win:
  icon: resources/icon-wangp.ico
  artifactName: ${productName}-Setup.${ext}

extraResources:
  - from: resources/icon-wangp.ico
    to: icon-wangp.ico

nsis:
  installerIcon: resources/icon-wangp.ico
  uninstallerIcon: resources/icon-wangp.ico
  installerHeaderIcon: resources/icon-wangp.ico
  shortcutName: LTX Desktop WanGP